<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Посвящение новых педагогов МША</title>
<style>
:root{--red:#C8102E;--blue:#1F5FAE;--navy:#0D2748;--sky:#E8F0FB;--w:#fff;--ink:#0D2748;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center;flex:none}
.s{position:absolute;inset:0;background:var(--w);display:none;padding:56px 72px;overflow:hidden}
.s.on{display:block}
.s.on.title,.s.on.fin{display:flex}
.s::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(var(--red),var(--red) 70%,var(--blue) 70%)}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.1}
h2{font-size:44px;color:var(--navy);margin-bottom:26px}
h2 em{color:var(--red);font-style:normal}
.logo{position:absolute;right:36px;top:26px;width:84px;height:auto;border-radius:50%}
.sub{font-size:24px;color:var(--blue)}
.dark{background:radial-gradient(circle at 20% 20%,#2a63b4,var(--navy) 70%);color:#fff}
.dark h1,.dark h2{color:#fff}
.dark::before{background:var(--red)}
/* title */
.title{flex-direction:column;justify-content:center;align-items:flex-start}
.title .big{width:190px;border-radius:50%;margin-bottom:28px;box-shadow:0 0 0 8px rgba(255,255,255,.15)}
.title h1{font-size:68px;max-width:900px}
.title p{font-size:28px;margin-top:20px;opacity:.9}
/* names */
.names{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.names div{background:var(--sky);border-left:6px solid var(--red);padding:26px 20px;font-size:28px;font-weight:600;border-radius:6px}
/* photo slots */
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;border:3px dashed var(--blue);border-radius:14px;background:var(--sky);color:var(--blue);font-size:22px;cursor:pointer;overflow:hidden;text-align:center;position:relative}
.ph input{display:none}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block}
.ph.has{border:none}
.duo{display:grid;grid-template-columns:1fr 360px;gap:40px;height:500px}
.cap{display:flex;flex-direction:column;justify-content:center;gap:14px}
.cap b{font-family:Georgia,serif;font-size:42px;color:var(--navy);line-height:1.1}
.cap span{font-size:26px;color:var(--red);font-weight:600}
.cap p{font-size:20px;color:var(--blue)}
/* wardrobe */
.ward{display:grid;grid-template-columns:1fr 1fr 220px 1fr 1fr 1fr;gap:6px;align-items:end;height:480px;margin-top:-6px}
.mq{height:430px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;gap:10px}
.mq b{font-size:18px;text-align:center;color:var(--navy);min-height:44px;display:flex;align-items:center}
.fig{position:relative;width:110px;height:300px}
.fig i{position:absolute;display:block;background:#C9D3E3;left:50%;transform:translateX(-50%)}
.hd{width:34px;height:42px;top:0;border-radius:50% 50% 45% 45%}
.bd{width:70px;height:110px;top:46px;border-radius:14px 14px 8px 8px}
.lg{width:22px;height:140px;top:156px;box-shadow:30px 0 0 #C9D3E3;left:35%!important;border-radius:4px}
.stand{position:absolute;left:50%;bottom:-6px;width:80px;height:6px;background:var(--navy);transform:translateX(-50%);border-radius:3px}
.co{position:absolute;left:50%;top:44px;width:104px;height:252px;margin-left:-52px;opacity:0;transform:translateY(-34px) scale(.92);transition:all .45s cubic-bezier(.2,.8,.3,1)}
.mq:hover .co,.mq.on .co,.mq:focus .co{opacity:1;transform:none}
.c1{background:linear-gradient(var(--navy) 48%,#2a4d85 48%);clip-path:polygon(14% 0,86% 0,100% 44%,84% 44%,82% 100%,18% 100%,16% 44%,0 44%)}
.c2{background:linear-gradient(90deg,var(--red) 40%,#fff 40% 46%,var(--red) 46%);clip-path:polygon(14% 0,86% 0,100% 44%,84% 44%,82% 100%,18% 100%,16% 44%,0 44%)}
.c3{background:linear-gradient(var(--blue),#123f7c);clip-path:polygon(18% 0,82% 0,76% 36%,100% 100%,0 100%,24% 36%)}
.c4{background:radial-gradient(circle at 25% 20%,#3d5a2a 22%,transparent 23%),radial-gradient(circle at 70% 50%,#6b5a3a 20%,transparent 21%),radial-gradient(circle at 30% 80%,#2f4a24 22%,transparent 23%),#5a7a3a;clip-path:polygon(14% 0,86% 0,100% 44%,84% 44%,82% 100%,18% 100%,16% 44%,0 44%)}
.c5{background:linear-gradient(#F28C1A 52%,#2b4a7c 52%);clip-path:polygon(14% 0,86% 0,100% 44%,84% 44%,82% 100%,18% 100%,16% 44%,0 44%)}
.hat{position:absolute;left:50%;top:-8px;width:50px;height:24px;margin-left:-25px;background:#F2C21A;border-radius:25px 25px 4px 4px;opacity:0;transition:.4s;transform:translateY(-24px)}
.mq:hover .hat,.mq.on .hat{opacity:1;transform:none}
.cab{height:430px;background:linear-gradient(90deg,#8d0c21,var(--red) 50%,#8d0c21);border-radius:10px 10px 0 0;border:6px solid #6f0919;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px;position:relative;align-self:end}
.cab::before,.cab::after{content:"";background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);border-radius:4px}
.cab span{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);background:#fff;color:var(--red);font-weight:800;font-size:19px;padding:8px 14px;border-radius:6px;z-index:2;text-align:center;font-family:Georgia,serif}
.hint{position:absolute;top:70px;left:520px;font-size:18px;color:var(--blue)}
/* video */
.vid{display:grid;grid-template-columns:330px 1fr;gap:34px;height:490px}
.terms{display:flex;flex-direction:column;gap:10px}
.terms button{font:600 24px system-ui;text-align:left;padding:14px 18px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;cursor:pointer}
.terms button.on{background:var(--red);border-color:var(--red);color:#fff}
.vid .ph{height:100%}
/* cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;height:470px}
.cw{perspective:900px;cursor:pointer}
.cd{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.cw.f .cd{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
.fr{background:linear-gradient(145deg,var(--red),#8d0c21);color:#fff;font:700 76px Georgia,serif;flex-direction:column}
.fr small{font:500 18px system-ui;opacity:.85}
.bk{background:var(--blue);color:#fff;transform:rotateY(180deg);font-size:23px;font-weight:600;line-height:1.25}
.cw:nth-child(even) .fr{background:linear-gradient(145deg,var(--blue),var(--navy))}
.cw:nth-child(even) .bk{background:var(--red)}
/* mission */
.mis{display:grid;grid-template-columns:1fr 1fr;gap:40px;height:500px}
/* oath */
.oath{display:flex;flex-direction:column;justify-content:center}
.oath .n{font:700 150px Georgia,serif;color:var(--red);line-height:1;opacity:.95}
.oath p{font-size:38px;line-height:1.35;max-width:1050px;font-weight:500}
.oath p strong{color:var(--red);display:block;margin-top:18px;font:700 54px Georgia,serif}
.oath.in p{font-size:42px;font-family:Georgia,serif}
.dark .oath p strong{color:#fff}
/* final */
.fin{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#0D2748 0%,#1F5FAE 55%,#C8102E 130%)}
.fin h1{font-size:84px;color:#fff;position:relative;z-index:2;max-width:1000px}
.fin p{font-size:36px;color:#fff;margin-top:22px;position:relative;z-index:2}
.fin img{width:130px;border-radius:50%;margin-bottom:26px;z-index:2;position:relative}
.dot{position:absolute;border-radius:2px;animation:fall linear infinite;opacity:.9}
@keyframes fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(780px) rotate(540deg)}}
/* nav */
#nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:9;background:rgba(13,39,72,.85);padding:6px 12px;border-radius:30px;color:#fff;font-size:14px}
#nav button{background:var(--red);color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.cd,.co{transition:none}}
</style></head><body>

const L=`<img class="logo" src="${LOGO}" alt="МША">`;
const slot=(t,cls='')=>`<label class="ph ${cls}"><input type="file" accept="image/*,video/*"><span>📷</span><div>${t}</div></label>`;
const teachers=[["Тамара Николаевна","Гимнастика"],["Лариса Николаевна","Киноклуб"],["Алия Аскаровна","Музыка"]];
const S=[];
S.push(`<section class="s dark title"><img class="big" src="${LOGO}" alt=""><h1>Посвящение новых педагогов</h1><p>Международная школа Алматы</p></section>`);
S.push(`<section class="s">${L}<h2>Встречайте <em>новичков</em></h2><div class="names">${["Тимур","Наталья","Батагоз","Мадина","Юлия","Бекзат","Сара","Ситора"].map(n=>`<div>${n}</div>`).join("")}</div></section>`);
teachers.forEach(([n,r])=>S.push(`<section class="s">${L}<h2>Педагог — это не только <em>учитель</em></h2><div class="duo">${slot("Фото: "+n)}<div class="cap"><b>${n}</b><span>${r}</span><p>В образе</p></div></div></section>`));
teachers.forEach(([n,r])=>S.push(`<section class="s">${L}<h2>А теперь — <em>вместе с новичками</em></h2><div class="duo">${slot("Групповое фото: "+n+" и новые педагоги")}<div class="cap"><b>${n}</b><span>${r}</span><p>и новые педагоги в том же образе</p></div></div></section>`));
const out=["1 сентября","День здоровья","Зимний бал","Камуфляж","День строителя"];
const mq=i=>`<div class="mq" tabindex="0"><div class="fig"><i class="hd"></i><i class="bd"></i><i class="lg"></i><div class="co c${i+1}"></div>${i==4?'<u class="hat"></u>':''}<span class="stand"></span></div><b>${out[i]}</b></div>`;
S.push(`<section class="s">${L}<h2>Гардероб <em>МША</em></h2><div class="ward">${mq(0)}${mq(1)}<div class="cab"><span>Гардероб МША</span></div>${mq(2)}${mq(3)}${mq(4)}</div><div class="hint">Наведите мышь или нажмите на манекен — он «оденется»</div></section>`);
const terms=["Интерпретация","Тригонометрия","Митоз","Интеграл","Алканы","Ямб"];
S.push(`<section class="s">${L}<h2>Что это значит? <em>Отвечают дети</em></h2><div class="vid"><div class="terms">${terms.map((t,i)=>`<button class="${i?'':'on'}">${i+1}. ${t}</button>`).join("")}</div><div id="vslot"></div></div></section>`);
const goals=["Ради вкусной еды столовой.","Ради школьных праздников.","Ради каникул.","Ради новых знакомств.","Потому что люблю детей.","За приключениями.","Ради бесконечного запаса канцелярии и стикеров всех цветов.","Чтобы легально пить кофе на переменах и объяснять, что это «педагогическая пауза»."];
S.push(`<section class="s">${L}<h2>С какой целью вы пришли <em>в МША?</em></h2><div class="cards">${goals.map((g,i)=>`<div class="cw"><div class="cd"><div class="fc fr">${i+1}<small>нажмите</small></div><div class="fc bk">${g}</div></div></div>`).join("")}</div></section>`);
S.push(`<section class="s">${L}<h2>Миссия <em>МША</em></h2><div class="mis">${slot("Плакат миссии с isoa.kz")}<div class="cap"><p style="font-size:26px;color:var(--navy)">Ведущие зачитывают миссию школы</p></div></div></section>`);
const oaths=["Приходить на работу за 5 минут до звонка и с улыбкой смотреть на первый урок.","Беречь нервную систему, запасаться терпением и пить чай с мелиссой во время перемены.","Находить общий язык с двоечниками, отличниками и родителями в чатах до полуночи.","Помнить, что глаза детей — это зеркало нашей души, а звонок с урока — наша общая радость.","Не падать в обморок, когда ученик вместо домашнего задания покажет лапки своего кота в качестве уважительной причины.","Обладать суперсилой — читать почерк, похожий на древнеегипетские иероглифы, и безошибочно отличать цифру 3 от цифры 8 в контрольных работах.","Мужественно закрывать глаза на родительские чаты после 21:00 и искренне верить, что до утра там не зародится новая цивилизация.","Свято беречь свои запасы красных ручек от таинственного школьного бермудского треугольника, в котором они исчезают каждую неделю."];
S.push(`<section class="s dark"><div class="oath in"><p>Вступая в ряды великого и беспокойного школьного сообщества МША, перед лицом коллег и студентов торжественно клянемся:</p></div></section>`);
oaths.forEach((o,i)=>S.push(`<section class="s${i%2?' dark':''}"><div class="oath"><div class="n">${i+1}</div><p>${i<4?'':'Клянусь '}${i<4?o:o.charAt(0).toLowerCase()+o.slice(1)}<strong>${i<4?'Клянемся!':'Клянусь!'}</strong></p></div></section>`));
S.push(`<section class="s fin" id="fin"><img src="${LOGO}" alt=""><h1>Добро пожаловать в МША!</h1><p>С посвящением!</p></section>`);
const st=document.getElementById("stage");st.innerHTML=S.join("");
const sl=[...st.children];let cur=0;
function show(i){cur=Math.max(0,Math.min(sl.length-1,i));sl.forEach((s,k)=>s.classList.toggle("on",k==cur));document.getElementById("ct").textContent=(cur+1)+" / "+sl.length}
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${k})`}
addEventListener("resize",fit);fit();
document.getElementById("pv").addEventListener("click",()=>show(cur-1));document.getElementById("nx").addEventListener("click",()=>show(cur+1));
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(cur+1)}if(["ArrowLeft","PageUp"].includes(e.key))show(cur-1)});
let x0=null;addEventListener("touchstart",e=>x0=e.touches[0].clientX);addEventListener("touchend",e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)show(cur+(d<0?1:-1));x0=null});
// photo slots
st.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),l=e.target.closest(".ph");l.classList.add("has");l.querySelectorAll("img,video,span,div").forEach(n=>n.remove());l.insertAdjacentHTML("beforeend",f.type.startsWith("video")?`<video src="${u}" controls></video>`:`<img src="${u}">`)});
// mannequins on touch
st.querySelectorAll(".mq").forEach(m=>m.onclick=()=>m.classList.toggle("on"));
st.querySelectorAll(".cw").forEach(c=>c.onclick=()=>c.classList.toggle("f"));
// videos
const vs=st.querySelector("#vslot"),vb=[...st.querySelectorAll(".terms button")],vmap={};
function pick(i){vb.forEach((b,k)=>b.classList.toggle("on",k==i));const old=vs.firstElementChild;if(old&&old.querySelector("video"))vmap.keep=null;vs.innerHTML=vmap[i]||slot("Видео: "+terms[i]);const lab=vs.firstElementChild;lab.style.height="100%";lab.querySelector("input").onchange=ev=>{const f=ev.target.files[0];if(!f)return;lab.classList.add("has");lab.innerHTML=`<video src="${URL.createObjectURL(f)}" controls></video>`;vmap[i]=lab.outerHTML.replace(/<video[^>]*>/,m=>m)}}
vb.forEach((b,i)=>b.onclick=()=>pick(i));pick(0);
// confetti
const fin=st.querySelector("#fin"),cs=["#fff","#C8102E","#7fb2ec","#fff"];
for(let i=0;i<46;i++){const d=document.createElement("i");d.className="dot";const s=6+Math.random()*10;d.style.cssText=`left:${Math.random()*100}%;top:0;width:${s}px;height:${s*1.6}px;background:${cs[i%4]};animation-duration:${5+Math.random()*6}s;animation-delay:-${Math.random()*10}s`;fin.appendChild(d)}
show(0);
</script></body></html>
